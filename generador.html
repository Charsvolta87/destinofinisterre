<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de eventos</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="imagenes/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">

  <style>

    body{
      background:#0a0a0a;
      color:white;
      font-family:Arial;
      padding:40px;
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin-bottom:20px;
      background:#111;
      border:1px solid #333;
      color:white;
    }

    button{
      padding:14px 24px;
      background:#7a0000;
      border:none;
      color:white;
      cursor:pointer;
    }

    pre{
      margin-top:30px;
      background:#111;
      padding:20px;
      overflow:auto;
    }

  </style>

</head>
<body>

  <h1>GENERADOR DE EVENTOS</h1>

  <input type="text" id="nombre" placeholder="Nombre del evento">

  <input type="text" id="fecha" placeholder="Fecha">

  <input type="text" id="carpeta" placeholder="Carpeta">

  <label>Fotos</label>
<input type="file" id="fotos" multiple accept="image/*">

<label>Videos</label>
<input type="file" id="videos" multiple accept="video/*">
  <button onclick="generarJS()">GENERAR</button>

  <pre id="resultado"></pre>

  <script>

    function generarJS(){

      const nombre = document.getElementById("nombre").value;

      const fecha = document.getElementById("fecha").value;

      const carpeta = document.getElementById("carpeta").value;

      const fotos = document.getElementById("fotos").files;

const videos = document.getElementById("videos").files;

    const fotosFinal = Array.from(fotos).map(file => {

  return `"imagenes/${carpeta}/${file.name}"`;

});

 const videosFinal = Array.from(videos).map(file => {

  return `"imagenes/${carpeta}/${file.name}"`;

});

      const js = `

{
  nombre: "${nombre}",
  fecha: "${fecha}",
  carpeta: "${carpeta}",

  fotos: [
    ${fotosFinal.join(",\n    ")}
  ],

  videos: [
    ${videosFinal.join(",\n    ")}
  ]
},

`;

      document.getElementById("resultado").textContent = js;
      const blob = new Blob([js], {
  type: "text/javascript"
});

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = `${carpeta}.js`;

link.click();

    }

  </script>

</body>
</html>
