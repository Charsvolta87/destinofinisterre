<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destino Finisterre</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="overlay"></div>

  <header class="hero">
    <img src="img/logo.png" alt="Destino Finisterre" class="logo">

    <h1>DESTINO FINISTERRE</h1>
    <p class="subtitle">Tributo a Patricio Rey y sus Redonditos de Ricota</p>

    <a href="#fechas" class="btn">PRÓXIMA FECHA</a>
  </header>

  <section class="section" id="fechas">
    <h2>PRÓXIMAS FECHAS</h2>

    <div class="card fecha-card">
      <h3>SÁBADO 16 DE MAYO</h3>
      <p>La Camencha – Glew</p>
      <p>21 HS</p>
    </div>
  </section>

  <section class="section integrantes">
    <h2>LA BANDA</h2>

    <div class="grid">

      <div class="member-card">
        <img src="img/nicolas.jpg" alt="Nicolas">
        <h3>Nicolás</h3>
        <p>Guitarra / Voz</p>
      </div>

      <div class="member-card">
        <img src="img/daniel.jpg" alt="Daniel">
        <h3>Daniel</h3>
        <p>Guitarra</p>
      </div>
</html>
